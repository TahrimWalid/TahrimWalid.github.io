<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08080a}
body{font-family:'JetBrains Mono',monospace;font-size:clamp(8px,1.6vw,11px);color:#ededf0}
.win{display:flex;flex-direction:column;height:100vh}
.bar{background:#111116;border-bottom:1px solid #222229;padding:6px 12px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%}
.dr{background:#ff5f57}.dy{background:#febc2e}.dg{background:#28c840}
.btit{margin-left:4px;color:#34343d;font-size:.82em;flex:1;text-align:center}

.body{flex:1;overflow-y:auto;padding:9px 14px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}

.run-row{opacity:0;animation:fadeIn .4s ease forwards;display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:3px;font-size:.82em}
@keyframes fadeIn{to{opacity:1}}
.run-row.med{border-left:2px solid #febc2e;background:rgba(254,188,46,.04)}
.run-row.high{border-left:2px solid #ef4444;background:rgba(239,68,68,.05)}
.run-tag{font-weight:700;min-width:6ch}
.run-tag.med{color:#febc2e}
.run-tag.high{color:#ef4444}
.run-text{color:#9a9aa4}
.run-text b{color:#ededf0}

.chat-cmd{margin-top:6px;padding:6px 10px;background:#0d0d12;border:1px solid #1e1e28;border-radius:2px;font-size:.8em;color:#5f5f6a;opacity:0}
.chat-cmd.show{opacity:1;transition:opacity .3s ease}
.chat-cmd .cmd-txt{color:#00ff41}

.answer-box{margin-top:6px;padding:10px 12px;border:1px solid #ef4444;border-radius:3px;background:rgba(239,68,68,.06);opacity:0}
.answer-box.show{opacity:1;transition:opacity .5s ease}
.answer-text{font-size:.88em;line-height:1.75;color:#ededf0}
.answer-text .cursor{display:inline-block;width:6px;height:1em;background:#00ff41;animation:blink 1s step-end infinite;vertical-align:text-bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.risk-line{margin-top:7px;font-weight:700;color:#ef4444;font-size:.86em;letter-spacing:.02em}

.compare-note{margin-top:8px;padding:8px 10px;border:1px dashed #34343d;border-radius:3px;font-size:.76em;color:#5f5f6a;line-height:1.6}
.compare-note .x{color:#ef4444}
.compare-note .ck{color:#00ff41}

.footer-meta{border-top:1px solid #222229;padding:4px 14px;flex-shrink:0;font-size:.68em;color:#5f5f6a;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <span class="dot dr"></span><span class="dot dy"></span><span class="dot dg"></span>
    <span class="btit">Thesis eval — Zyxel VMG3625-T50B · Mixtile Blade 3 (ARM64) · qwen2.5-coder-7b</span>
  </div>

  <div class="body" id="body"></div>

  <div class="footer-meta">
    <span>3 adversarial runs · 0 hallucinations across 12 queries</span>
    <span>URN:NBN:fi:amk-2026051813153</span>
  </div>
</div>

<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function typeText(el, text, speed=20) {
  for (const c of text) {
    el.insertAdjacentText('beforeend', c);
    document.getElementById('body').scrollTop = 99999;
    await sleep(speed + Math.random() * 8);
  }
}

function runRow(tag, cls, html) {
  const row = document.createElement('div');
  row.className = 'run-row ' + cls;
  row.innerHTML = `<span class="run-tag ${cls}">${tag}</span><span class="run-text">${html}</span>`;
  return row;
}

async function run() {
  const body = document.getElementById('body');
  while (true) {
    body.innerHTML = '';

    body.appendChild(runRow('RUN 1', 'med', '<b>MEDIUM</b> — SSH exposure + 5 failed logins, 12 open ports enumerated. LLM recommended rate-limiting and key-based auth.'));
    body.scrollTop = 99999;
    await sleep(1600);

    body.appendChild(runRow('RUN 2', 'med', '<b>MEDIUM → escalation</b> — repeated failed SSH → account lockout observed. LLM escalated from hygiene advice to "stop the service immediately."'));
    body.scrollTop = 99999;
    await sleep(1800);

    body.appendChild(runRow('RUN 3', 'high', '<b>HIGH</b> — after gateway lockout, internal auth bursts appeared on the node itself.'));
    body.scrollTop = 99999;
    await sleep(1400);

    const cmd = document.createElement('div');
    cmd.className = 'chat-cmd';
    cmd.innerHTML = 'you› <span class="cmd-txt">kratos chat -q "Analyze the internal authentication bursts. Do they suggest a pivot from the gateway?"</span>';
    body.appendChild(cmd);
    body.scrollTop = 99999;
    await sleep(150);
    cmd.classList.add('show');
    await sleep(1200);

    const answerBox = document.createElement('div');
    answerBox.className = 'answer-box';
    answerBox.innerHTML = '<div class="answer-text" id="atext"></div>';
    body.appendChild(answerBox);
    answerBox.classList.add('show');
    await sleep(300);

    const atext = document.getElementById('atext');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    atext.appendChild(cursor);

    const answer = 'It is reasonable to infer that there may be a pivot from the gateway — the gateway lockout and subsequent internal auth_other burst (34 events) are temporally correlated. A traditional alert system would surface these as separate findings.';
    for (const c of answer) {
      cursor.insertAdjacentText('beforebegin', c);
      body.scrollTop = 99999;
      await sleep(16 + Math.random() * 6);
    }
    cursor.remove();

    const risk = document.createElement('div');
    risk.className = 'risk-line';
    risk.textContent = 'OVERALL RISK LEVEL: HIGH';
    answerBox.appendChild(risk);
    body.scrollTop = 99999;
    await sleep(1200);

    const note = document.createElement('div');
    note.className = 'compare-note';
    note.innerHTML = '<span class="x">✗ rule-only system:</span> two disconnected alerts — gateway lockout, internal auth spike<br><span class="ck">✓ Kratos:</span> connects them across runs and infers lateral-movement / pivot attempt — the key result';
    body.appendChild(note);
    body.scrollTop = 99999;

    await sleep(6500);
  }
}
run();
</script>
</body>
</html>
