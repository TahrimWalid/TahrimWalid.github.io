<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08080a}
body{font-family:'JetBrains Mono',monospace;font-size:clamp(8.5px,1.75vw,11.5px)}
.win{display:flex;flex-direction:column;height:100vh}
.bar{background:#111116;border-bottom:1px solid #222229;padding:7px 12px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%}
.dr{background:#ff5f57}.dy{background:#febc2e}.dg{background:#28c840}
.btit{margin-left:4px;color:#34343d;font-size:.82em;flex:1;text-align:center}
.body{flex:1;overflow-y:auto;padding:10px 14px;line-height:1.62;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.l{display:block;white-space:pre-wrap;word-break:break-all}
.lp{color:#00ff41}.lo{color:#ededf0}.lk{color:#00ff41}
.ld{color:#5f5f6a}.lb{}.lw{color:#febc2e}.lr{color:#3b82f6}.lm{color:#ef4444}
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <span class="dot dr"></span><span class="dot dy"></span><span class="dot dg"></span>
    <span class="btit">walid@homelab-node1: ~/oppipolku — get_courses_with_desc.py</span>
  </div>
  <div class="body" id="tb"></div>
</div>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
const S = [
  {t:'p',v:'(venv) walid@homelab-node1:~/oppipolku$ python get_courses_with_desc.py',a:700},
  {t:'b',v:'',a:60},
  {t:'w',v:'Fetching study options from opin.fi ...',a:150},
  {t:'ld',v:'  search page    0 ... 100 items  (running total: 100)',a:70},
  {t:'ld',v:'  search page    1 ... 100 items  (running total: 200)',a:70},
  {t:'ld',v:'  search page    2 ... 100 items  (running total: 300)',a:70},
  {t:'ld',v:'  ...',a:400},
  {t:'ld',v:'  search page  138 ... 100 items  (running total: 13,900)',a:70},
  {t:'ld',v:'  search page  139 ...  empty -- done.',a:120},
  {t:'k',v:'  13,846 study options discovered across 36 organizations',a:900},
  {t:'b',v:'',a:60},
  {t:'w',v:'Fetching org names ...',a:250},
  {t:'ld',v:'  resolved 36 organisations',a:900},
  {t:'b',v:'',a:60},
  {t:'w',v:'Detecting Next.js build ID ...',a:400},
  {t:'ld',v:'  GET https://opin.fi/en/  ...  200 OK',a:150},
  {t:'ld',v:'  scanning HTML for /_next/static/<id>/_ssgManifest.js ...',a:200},
  {t:'k',v:'  build ID: 4a68e523f19c7d21  (via _ssgManifest.js)',a:900},
  {t:'b',v:'',a:60},
  {t:'w',v:'Fetching per-course detail JSON via Next.js data route ...',a:250},
  {t:'r',v:'  GET /_next/data/4a68e523f19c7d21/en/study-options/tamk/...json',a:60},
  {t:'ld',v:'    → details/cc6d2ce8-.../digitaalinen-markkinointi__a1f9.json',a:70},
  {t:'r',v:'  GET /_next/data/4a68e523f19c7d21/en/study-options/metropolia/...json',a:60},
  {t:'ld',v:'    → details/d6a6cea3-.../uxsuunnittelun-perusteet__b3c2.json',a:70},
  {t:'r',v:'  GET /_next/data/4a68e523f19c7d21/en/study-modules/helsinki/...json',a:60},

  {t:'ld',v:'  ✓ recovered after retry',a:500},

  {t:'b',v:'',a:60},
  {t:'r',v:'Done in 62m 14s.',a:2500},
];
const CLS={p:'lp',k:'lk',o:'lo',d:'ld',b:'lb',w:'lw',r:'lr',m:'lm',ld:'ld'};
async function run(){
  const tb=document.getElementById('tb');
  while(true){
    tb.innerHTML='';
    for(const e of S){
      if(!document.getElementById('tb')) return;
      const d=document.createElement('span');
      d.className='l '+(CLS[e.t]||'lo');
      tb.appendChild(d);
      if(e.t==='p'){
        for(const c of e.v){d.textContent+=c;tb.scrollTop=tb.scrollHeight;await sleep(26+Math.random()*10);}
      } else {d.textContent=e.v;tb.scrollTop=tb.scrollHeight;}
      await sleep(e.a||60);
    }
    await sleep(4000);
  }
}
run();
</script>
</body>
</html>
