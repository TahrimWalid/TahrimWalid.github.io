<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08080a}
.wrap{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
img{position:absolute;max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease}
img.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const frames = [
  {src:'assets/kratos-tui/02_investigation_00.svg', hold:900},
  {src:'assets/kratos-tui/02_investigation_01.svg', hold:700},
  {src:'assets/kratos-tui/02_investigation_02.svg', hold:1400},
  {src:'assets/kratos-tui/02_investigation_03.svg', hold:1400},
  {src:'assets/kratos-tui/02_investigation_04.svg', hold:900},
  {src:'assets/kratos-tui/02_investigation_05.svg', hold:1800},
  {src:'assets/kratos-tui/02_investigation_06.svg', hold:2600},
  {src:'assets/kratos-tui/02_investigation_08.svg', hold:3200},
];
const wrap = document.getElementById('wrap');
const imgs = frames.map(f => {
  const img = document.createElement('img');
  img.src = f.src;
  wrap.appendChild(img);
  return img;
});
let i = 0;
function showNext() {
  imgs.forEach((im, idx) => im.classList.toggle('show', idx === i));
  const hold = frames[i].hold;
  i = (i + 1) % frames.length;
  setTimeout(showNext, hold);
}
imgs[0].classList.add('show');
setTimeout(showNext, frames[0].hold);
</script>
</body>
</html>
