<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08080a}
body{font-family:'JetBrains Mono',monospace;font-size:clamp(9px,1.85vw,12px)}
.win{display:flex;flex-direction:column;height:100vh}
.bar{background:#111116;border-bottom:1px solid #222229;padding:7px 12px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%}
.dr{background:#ff5f57}.dy{background:#febc2e}.dg{background:#28c840}
.btit{margin-left:4px;color:#34343d;font-size:.82em;flex:1;text-align:center}
.body{flex:1;overflow-y:auto;padding:10px 14px;line-height:1.65;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.l{display:block;white-space:pre-wrap;word-break:break-all}
.lp{color:#00ff41}.lo{color:#ededf0}.lk{color:#00ff41}
.ld{color:#5f5f6a}.lb{}.lw{color:#febc2e}.lr{color:#3b82f6}
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <span class="dot dr"></span><span class="dot dy"></span><span class="dot dg"></span>
    <span class="btit">walid@homelab-node1: ~/oppipolku — bash</span>
  </div>
  <div class="body" id="tb"></div>
</div>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
const S = [
  {t:'p',v:'(venv) walid@homelab-node1:~/oppipolku$ python run_api.py',a:900},
  {t:'b',v:'',a:60},
  {t:'w',v:'INFO:     Continuous Learning Benchmark API v1.0',a:80},
  {t:'ld',v:'INFO:     Loading organizations.json...',a:60},
  {t:'k',v:'INFO:     36 organizations indexed',a:80},
  {t:'ld',v:'INFO:     Scanning details/ for course JSON files...',a:120},
  {t:'ld',v:'INFO:     Loaded  2,078 courses  →  University of Helsinki',a:60},
  {t:'ld',v:'INFO:     Loaded    948 courses  →  Metropolia UAS',a:60},
  {t:'ld',v:'INFO:     Loaded    731 courses  →  Tampere University',a:60},
  {t:'ld',v:'INFO:     Loaded    310 courses  →  TAMK (Tampere UAS)',a:60},
  {t:'ld',v:'INFO:     Loaded    ... (32 more organizations)',a:120},
  {t:'k',v:'INFO:     Total: 13,846 courses across 36 organizations',a:80},
  {t:'ld',v:'INFO:     Type split: COURSE_UNIT: 7,218  ·  PACKAGE: 6,628',a:80},
  {t:'ld',v:'INFO:     Building COURSES_BY_ORG and COURSES_BY_TYPE indexes...',a:100},
  {t:'k',v:'INFO:     Indexes ready  ·  5-tier endpoint structure active',a:900},
  {t:'b',v:'',a:60},
  {t:'r',v:'INFO:     Application startup complete.',a:130},
  {t:'r',v:'INFO:     Uvicorn running on http://0.0.0.0:8000',a:1400},
  {t:'b',v:'',a:80},
  {t:'p',v:'(venv) walid@homelab-node1:~/oppipolku$ curl http://localhost:8000/health',a:400},
  {t:'o',v:'{"status":"ok","courses":13846,"organizations":36,"tiers":5,"response_ms":3}',a:1800},
  {t:'b',v:'',a:60},
  {t:'p',v:'(venv) walid@homelab-node1:~/oppipolku$ curl http://localhost:8000/pipeline/status',a:400},
  {t:'o',v:'{',a:60},
  {t:'o',v:'  "source": "opin.fi",',a:50},
  {t:'o',v:'  "cadence": "daily at 06:00 UTC via systemd timer",',a:50},
  {t:'o',v:'  "last_fetch": "2026-09-17T06:00:41Z",',a:50},
  {t:'o',v:'  "courses_in_dataset": 13846,',a:50},
  {t:'o',v:'  "organizations_in_dataset": 36,',a:50},
  {t:'o',v:'  "auto_deploy": "polls origin/master every 3 min"',a:50},
  {t:'o',v:'}',a:50},
];
const CLS={p:'lp',k:'lk',o:'lo',d:'ld',b:'lb',w:'lw',r:'lr',ld:'ld'};
async function run(){
  const tb=document.getElementById('tb');
  while(true){
    tb.innerHTML='';
    for(const e of S){
      if(!document.getElementById('tb')) return;
      const d=document.createElement('span');
      d.className='l '+(CLS[e.t]||'lo');
      tb.appendChild(d);
      if(e.t==='p'){
        for(const c of e.v){d.textContent+=c;tb.scrollTop=tb.scrollHeight;await sleep(28+Math.random()*10);}
      } else {d.textContent=e.v;tb.scrollTop=tb.scrollHeight;}
      await sleep(e.a||60);
    }
    await sleep(4000);
  }
}
run();
</script>
</body>
</html>
