body {

}

/* Fluid Background Glow */
.bg-glow {
  position: fixed; inset: -50%; z-index: -1;
  background:

    radial-gradient(circle at 80% 70%, rgba(123, 97, 255, 0.07) 0%, transparent 40%);
  filter: blur(80px);
  animation: pulse-glow 20s ease-in-out infinite alternate;
}
@keyframes pulse-glow {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.1) rotate(5deg); }
}

/* Grid overlay */
.bg-grid {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-size: 60px 60px;
  background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),

  mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
}

/* Custom Follow Cursor */
#cursor-glow {
  position: fixed; width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(0,255,163,0.12) 0%, transparent 60%);
  border-radius: 50%; pointer-events: none; z-index: 0;
  transform: translate(-50%, -50%);
  transition: width 0.2s, height 0.2s;
  mix-blend-mode: screen;
}

.nav-link:hover { color: var(--text); }

.container { max-width: 1200px; margin: 0 auto; padding: 0 5vw; position: relative; z-index: 1; }

  content: ''; position: absolute; inset: 0; z-index: 0; opacity: 0; pointer-events: none;

.col-span-8 { grid-column: span 8; }
.col-span-7 { grid-column: span 7; }
.col-span-6 { grid-column: span 6; }
.col-span-5 { grid-column: span 5; }
.col-span-4 { grid-column: span 4; }

    state.route = 'project'; state.projectId = parts[1];
  }
  
  document.querySelectorAll('.nav-link').forEach(n => {
    n.removeAttribute('data-active');
    if (n.getAttribute('data-route') === (state.route === 'project' ? 'projects' : state.route)) {
      n.setAttribute('data-active', '');
    }
  });

  const app = document.getElementById('app');
  const maps = { home: renderHome, projects: renderProjects, project: renderProjectDetail, about: renderAbout, contact: renderContact };
  app.innerHTML = (maps[state.route] || renderHome)();
  window.scrollTo(0, 0);
  
  setTimeout(() => {
    document.querySelectorAll('.reveal').forEach((el, i) => {
      setTimeout(() => el.classList.add('active'), i * 100);
    });
    
    if (state.route === 'home') runTypewriter();
    if (state.route === 'about') runTerminal();
  }, 50);
}

function runTypewriter() {
  const tw = document.getElementById('typewriter');
  if(!tw) return;
  const text = "Backend • Cloud Infrastructure • Edge AI Inference";
  let i = 0; tw.innerHTML = '';
  const iv = setInterval(() => {
    tw.innerHTML = text.slice(0, ++i) + '<span style="border-right: 2px solid var(--accent); padding-right: 2px; animation: blink 1s step-end infinite;"></span>';
    if(i >= text.length) clearInterval(iv);
  }, 40);
}

function runTerminal() {
  const tb = document.getElementById('term-body');
  if(!tb) return;
  tb.innerHTML = '<div style="color: var(--accent); margin-bottom:10px;">$ fetching timeline...</div>';
  setTimeout(() => {
    tb.innerHTML += `
      <div style="margin-bottom: 5px;"><span style="color:#FF5F56;">2024-2026</span>  TAMK B.Eng Software Engineering</div>
      <div style="margin-bottom: 5px;"><span style="color:#FFBD2E;">2025</span>       Oppipolku Backend Lead (Funded €5k)</div>
      <div style="margin-bottom: 5px;"><span style="color:#FFBD2E;">2025</span>       Kratos Agentic Assistant</div>
      <div style="margin-bottom: 5px;"><span style="color:#FFBD2E;">2025</span>       InGen Full-Stack & GenAI</div>
      <div style="margin-bottom: 5px;"><span style="color:#27C93F;">2026</span>       Career AI ETL Pipeline</div>
      <div style="margin-top: 15px; color: var(--accent);">$ status check</div>
      <div style="color: var(--text);">> Pursuing AZ-104</div>
      <div style="color: var(--text);">> Ready for hire<span style="border-right: 8px solid var(--accent); animation: blink 1s step-end infinite; display: inline-block; width: 8px; height: 14px; transform: translateY(2px); margin-left: 5px;"></span></div>
    `;
  }, 600);
}

// Mouse Follower
document.addEventListener('mousemove', e => {
  const cursor = document.getElementById('cursor-glow');
  if(cursor) {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  }
  
  // Card hover glow effect
  document.querySelectorAll('.glass-card').forEach(card => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    card.style.setProperty('--mouse-x', `${x}px`);
    card.style.setProperty('--mouse-y', `${y}px`);
  });
});

window.addEventListener('hashchange', onHash);
document.addEventListener('DOMContentLoaded', onHash);

</script>
