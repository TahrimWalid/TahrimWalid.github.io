<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walid Hassan Tahrim — Engineer</title>
<meta name="description" content="Software Engineering graduate from TAMK. Backend, cloud, and local AI pipelines. Based in Tampere, Finland.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030305;
  --bg-glass: rgba(10, 10, 15, 0.4);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.2);
  --text: #f0f0f5;
  --text-dim: #9494a0;
  --text-faint: #565665;
  --accent: #00FFA3;
  --accent-dim: rgba(0, 255, 163, 0.15);
  --accent2: #7B61FF;
  --font-sans: 'Space Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-display: 'Outfit', sans-serif;
  --nav-h: 80px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { 
  background-color: var(--bg); 
  color: var(--text); 
  font-family: var(--font-sans); 
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--accent); color: #000; }
a { color: inherit; text-decoration: none; }

/* Noise Overlay */
.noise {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none; opacity: 0.04;
  background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)"/%3E%3C/svg%3E');
}

/* Fluid Background Glow */
.bg-glow {
  position: fixed; inset: -50%; z-index: -1;
  background: 
    radial-gradient(circle at 20% 30%, rgba(0, 255, 163, 0.07) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(123, 97, 255, 0.07) 0%, transparent 40%);
  filter: blur(80px);
  animation: pulse-glow 20s ease-in-out infinite alternate;
}
@keyframes pulse-glow {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.1) rotate(5deg); }
}

/* Grid overlay */
.bg-grid {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-size: 60px 60px;
  background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
  mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
}

/* Custom Follow Cursor */
#cursor-glow {
  position: fixed; width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(0,255,163,0.12) 0%, transparent 60%);
  border-radius: 50%; pointer-events: none; z-index: 0;
  transform: translate(-50%, -50%);
  transition: width 0.2s, height 0.2s;
  mix-blend-mode: screen;
}

/* Nav */
.navbar {
  position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(10, 10, 15, 0.65);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border); border-radius: 100px;
  padding: 8px 12px; display: flex; align-items: center; gap: 8px;
  z-index: 1000; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.nav-link {
  font-family: var(--font-mono); font-size: 0.8rem;
  padding: 10px 24px; border-radius: 100px;
  color: var(--text-dim); transition: all 0.3s ease;
  position: relative; overflow: hidden;
}
.nav-link::before {
  content: ''; position: absolute; inset: 0; background: var(--accent-dim);
  border-radius: 100px; opacity: 0; transition: opacity 0.3s; z-index: -1;
}
.nav-link:hover { color: var(--text); }
.nav-link[data-active] { color: var(--accent); }
.nav-link[data-active]::before { opacity: 1; }

.container { max-width: 1200px; margin: 0 auto; padding: 0 5vw; position: relative; z-index: 1; }

/* Typography */
.display-title {
  font-family: var(--font-display); font-size: clamp(3rem, 9vw, 7.5rem);
  font-weight: 800; line-height: 0.9; letter-spacing: -0.04em;
  background: linear-gradient(135deg, #fff 0%, #7B61FF 50%, #00FFA3 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 24px;
}
.subtitle {
  font-family: var(--font-mono); font-size: clamp(1rem, 1.5vw, 1.2rem);
  color: var(--accent); letter-spacing: 0.05em; margin-bottom: 30px;
}
.text-body {
  font-size: 1.15rem; color: var(--text-dim); line-height: 1.8; max-width: 600px;
}

/* Glass Cards */
.bento-grid {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;
}
.glass-card {
  background: var(--bg-glass); border: 1px solid var(--border);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px; padding: 40px; position: relative; overflow: hidden;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, box-shadow 0.3s;
}
.glass-card::before {
  content: ''; position: absolute; inset: 0; z-index: 0; opacity: 0; pointer-events: none;
  background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.06), transparent 40%);
  transition: opacity 0.4s;
}
.glass-card:hover::before { opacity: 1; }
.glass-card:hover {
  border-color: var(--border-hover); transform: translateY(-5px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,255,163,0.1);
}
.glass-card > * { position: relative; z-index: 1; }

.col-span-12 { grid-column: span 12; }
.col-span-8 { grid-column: span 8; }
.col-span-7 { grid-column: span 7; }
.col-span-6 { grid-column: span 6; }
.col-span-5 { grid-column: span 5; }
.col-span-4 { grid-column: span 4; }

@media (max-width: 900px) {
  .col-span-8, .col-span-7, .col-span-6, .col-span-5, .col-span-4 { grid-column: span 12; }
  .navbar { width: 90%; justify-content: space-between; padding: 8px; }
  .nav-link { padding: 10px 14px; font-size: 0.75rem; }
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 16px 32px; border-radius: 100px;
  font-family: var(--font-mono); font-size: 0.9rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.05em;
  transition: all 0.3s ease; cursor: pointer;
}
.btn-primary {
  background: var(--text); color: var(--bg);
}
.btn-primary:hover {
  background: var(--accent); transform: scale(1.05);
  box-shadow: 0 10px 30px var(--accent-dim);
}
.btn-secondary {
  background: transparent; color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  border-color: var(--text); transform: scale(1.05);
}

/* Reveal Animation */
.reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
.reveal.active { opacity: 1; transform: translateY(0); }

/* Custom elements */
.status-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 100px;
  border: 1px solid var(--border); background: var(--bg-glass);
  font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim);
  margin-bottom: 40px;
}
.status-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }

.project-tag {
  font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
  background: var(--accent-dim); color: var(--accent);
  padding: 4px 12px; border-radius: 100px; text-transform: uppercase;
}

.tech-pill {
  font-family: var(--font-mono); font-size: 0.75rem;
  padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(0,0,0,0.3);
  color: var(--text-dim); display: inline-flex; align-items: center; gap: 6px;
}

/* Terminal */
.terminal {
  background: #09090b; border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
  font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-dim);
  box-shadow: 0 30px 60px rgba(0,0,0,0.4);
}
.terminal-header {
  background: #121216; padding: 12px 20px; display: flex; gap: 8px; border-bottom: 1px solid var(--border);
}
.terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
.terminal-body { padding: 30px; line-height: 1.8; min-height: 300px; }

/* Demo iFrames */
.demo-frame-wrapper {
  position: relative; width: 100%; aspect-ratio: 16/9;
  border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
  margin-top: 20px; background: #000;
}
.demo-frame-wrapper iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: none;
}
</style>
</head>
<body>
<div class="noise"></div>
<div class="bg-glow"></div>
<div class="bg-grid"></div>
<div id="cursor-glow"></div>

<nav class="navbar">
  <a href="#/" class="nav-link" data-route="home">Home</a>
  <a href="#/projects" class="nav-link" data-route="projects">Projects</a>
  <a href="#/about" class="nav-link" data-route="about">About</a>
  <a href="#/contact" class="nav-link" data-route="contact">Contact</a>
</nav>

<main id="app" style="min-height: 100vh; padding-top: 160px; padding-bottom: 100px;"></main>

<footer style="margin-top: 100px; padding: 40px 0; border-top: 1px solid var(--border);">
  <div class="container" style="display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-faint);">
    <span>© 2026 Walid Hassan Tahrim. Designed for performance.</span>
    <div style="display: flex; gap: 20px;">
      <a href="https://github.com/TahrimWalid" style="color: var(--text-dim); transition: color 0.3s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-dim)'">GitHub</a>
      <a href="https://linkedin.com/in/walid-hassan-tahrim" style="color: var(--text-dim); transition: color 0.3s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-dim)'">LinkedIn</a>
    </div>
  </div>
</footer>

<script>
${skills}
${projects}
${pIcons}
${tIcons}

// Router State
const state = { route: 'home', projectId: null };

function techBadge(t) {
  const src = TECH_ICONS[t];
  const img = src ? `<img src="${src}" width="14" height="14" style="border-radius:2px;">` : '';
  return `<span class="tech-pill">${img}${t}</span>`;
}

function renderHome() {
  return `
    <div class="container">
      <div class="reveal" style="padding-top: 6vh; padding-bottom: 10vh;">
        <div class="status-pill">
          <div class="status-dot"></div>
          AVAILABLE FOR HIRE · TAMPERE, FI
        </div>
        <h1 class="display-title">WALID<br>HASSAN.</h1>
        <div class="subtitle" id="typewriter"></div>
        <p class="text-body" style="margin-bottom: 40px; font-size: 1.25rem;">
          Engineering at the edge of the stack. Building high-performance backend systems, local AI pipelines, and cloud infrastructure that works in the real world.
        </p>
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
          <a href="#/projects" class="btn btn-primary">Explore Work</a>
          <a href="#/about" class="btn btn-secondary">About Me</a>
        </div>
      </div>

      <div class="reveal" style="margin-top: 100px;">
        <h2 style="font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 40px;">Featured Engineering</h2>
        <div class="bento-grid">
          ${PROJECTS.slice(0, 3).map((p, i) => `
            <div class="glass-card ${i === 0 ? 'col-span-12' : 'col-span-6'}" style="display: flex; flex-direction: ${i===0 ? 'row' : 'column'}; gap: 40px; align-items: ${i===0 ? 'center' : 'flex-start'}; cursor: pointer;" onclick="location.hash='#/projects/${p.id}'">
              <div style="flex: 1;">
                <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 16px;">
                  ${p.tag ? `<span class="project-tag">${p.tag}</span>` : ''}
                  <span style="font-family: var(--font-mono); color: var(--text-faint);">0${i+1}</span>
                </div>
                <h3 style="font-family: var(--font-display); font-size: ${i===0 ? '3rem' : '2rem'}; margin-bottom: 12px;">${p.name}</h3>
                <p style="font-family: var(--font-mono); color: var(--accent); margin-bottom: 20px;">${p.subtitle}</p>
                <p style="color: var(--text-dim); line-height: 1.6; margin-bottom: 30px; font-size: 1.05rem;">${p.oneliner}</p>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  ${p.stack.slice(0,4).map(t => techBadge(t)).join('')}
                  ${p.stack.length > 4 ? `<span class="tech-pill">+${p.stack.length - 4}</span>` : ''}
                </div>
              </div>
              ${i === 0 && p.stageDemos[0] ? `
                <div style="flex: 1; min-width: 300px; width: 100%;">
                  <div class="demo-frame-wrapper" style="pointer-events: none; margin:0; box-shadow: 0 30px 60px rgba(0,0,0,0.5); transform: perspective(1000px) rotateY(-5deg) rotateX(5deg);">
                    <iframe src="${p.stageDemos[0]}"></iframe>
                  </div>
                </div>
              ` : `
                <div style="position: absolute; right: -20px; bottom: -20px; opacity: 0.05; width: 200px; pointer-events: none;">
                  ${PROJECT_ICONS[p.id] || ''}
                </div>
              `}
            </div>
          `).join('')}
        </div>
        <div style="text-align: center; margin-top: 60px;">
          <a href="#/projects" class="btn btn-secondary" style="border-color: var(--border);">View All Projects</a>
        </div>
      </div>
    </div>
  `;
}

function renderProjects() {
  return `
    <div class="container">
      <div class="reveal" style="margin-bottom: 80px;">
        <h1 class="display-title" style="font-size: clamp(2.5rem, 6vw, 5rem);">SYSTEMS<br>& PIPELINES.</h1>
        <p class="text-body" style="font-size: 1.2rem;">Architectures shipped against real constraints — agentic boundaries, self-hosted models, scraped data at scale, and pure offline tooling.</p>
      </div>

      <div class="bento-grid">
        ${PROJECTS.map((p, i) => `
          <div class="glass-card col-span-12 reveal" style="display: grid; grid-template-columns: 1fr 2fr; gap: 60px; padding: 60px;">
            <div>
              <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px;">
                <span style="font-family: var(--font-mono); font-size: 1.5rem; color: var(--accent);">0${i+1}</span>
                ${p.tag ? `<span class="project-tag">${p.tag}</span>` : ''}
              </div>
              <h2 style="font-family: var(--font-display); font-size: 3rem; margin-bottom: 12px; line-height: 1.1;">${p.name}</h2>
              <p style="font-family: var(--font-mono); color: var(--accent); margin-bottom: 30px;">${p.subtitle}</p>
              
              <div style="margin-bottom: 40px;">
                <div style="font-family: var(--font-display); font-size: 2.5rem; font-weight: 700; color: #fff;">${p.stat.value}</div>
                <div style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-faint); text-transform: uppercase;">${p.stat.label}</div>
              </div>

              <a href="#/projects/${p.id}" class="btn btn-secondary" style="padding: 12px 24px; font-size: 0.8rem;">Deep Dive →</a>
            </div>
            
            <div style="display: flex; flex-direction: column; justify-content: space-between;">
              <p style="font-size: 1.15rem; color: var(--text-dim); line-height: 1.8; margin-bottom: 30px;">${p.oneliner}</p>
              <div>
                <div style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-faint); margin-bottom: 16px; text-transform: uppercase;">Tech Stack</div>
                <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                  ${p.stack.map(t => techBadge(t)).join('')}
                </div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderProjectDetail() {
  const p = PROJECTS.find(p => p.id === state.projectId) || PROJECTS[0];
  
  return `
    <div class="container">
      <a href="#/projects" style="font-family: var(--font-mono); color: var(--text-dim); display: inline-block; margin-bottom: 40px; transition: color 0.3s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-dim)'">← Back to Projects</a>
      
      <div class="reveal" style="margin-bottom: 60px;">
        ${p.tag ? `<span class="project-tag" style="margin-bottom: 20px; display: inline-block;">${p.tag}</span>` : ''}
        <h1 class="display-title" style="font-size: clamp(3rem, 7vw, 6rem);">${p.name.toUpperCase()}</h1>
        <p style="font-family: var(--font-mono); font-size: 1.2rem; color: var(--accent); margin-bottom: 40px;">${p.subtitle}</p>
        
        <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 40px;">
          ${p.links.map(l => `
            <a href="https://${l.url}" target="_blank" class="btn btn-secondary" style="padding: 10px 20px; font-size: 0.8rem;">
              ${l.label} ↗
            </a>
          `).join('')}
        </div>
      </div>

      <div class="bento-grid reveal">
        <div class="col-span-8 glass-card" style="padding: 50px;">
          <h3 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 24px;">Architecture & Overview</h3>
          ${p.description.map(d => `<p style="color: var(--text-dim); font-size: 1.1rem; line-height: 1.8; margin-bottom: 24px;">${d}</p>`).join('')}
          ${p.note ? `
            <div style="background: rgba(0, 255, 163, 0.05); border-left: 3px solid var(--accent); padding: 20px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.9rem; color: var(--text);">
              ${p.note}
            </div>
          ` : ''}
        </div>
        
        <div class="col-span-4" style="display: flex; flex-direction: column; gap: 24px;">
          <div class="glass-card" style="padding: 40px;">
            <h3 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 24px;">Stack</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 10px;">
              ${p.stack.map(t => techBadge(t)).join('')}
            </div>
          </div>
          <div class="glass-card" style="padding: 40px; background: linear-gradient(135deg, rgba(123, 97, 255, 0.1), transparent);">
            <div style="font-family: var(--font-display); font-size: 3rem; font-weight: 700; color: var(--text);">${p.stat.value}</div>
            <div style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--accent); text-transform: uppercase;">${p.stat.label}</div>
          </div>
        </div>
      </div>

      <div class="reveal" style="margin-top: 80px;">
        <h2 style="font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 40px;">System Walkthrough</h2>
        <div class="bento-grid">
          ${p.stages.map((s, i) => `
            <div class="glass-card col-span-6" style="padding: 30px;">
              <div style="display: flex; gap: 12px; align-items: flex-start; margin-bottom: 20px;">
                <span style="font-family: var(--font-mono); color: var(--accent);">0${i+1}</span>
                <h4 style="font-size: 1.1rem; line-height: 1.5;">${s}</h4>
              </div>
              ${p.stageDemos[i] ? `
                <div class="demo-frame-wrapper">
                  <iframe src="${p.stageDemos[i]}" loading="lazy"></iframe>
                </div>
              ` : `
                <div class="demo-frame-wrapper" style="display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.02); border-style: dashed;">
                  <span style="font-family: var(--font-mono); color: var(--text-faint);">[ Demo Missing ]</span>
                </div>
              `}
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderAbout() {
  return `
    <div class="container">
      <div class="reveal" style="margin-bottom: 80px;">
        <h1 class="display-title" style="font-size: clamp(3rem, 7vw, 6rem);">ENGINEERING<br>AT THE EDGE.</h1>
      </div>

      <div class="bento-grid">
        <div class="glass-card col-span-7 reveal" style="padding: 50px;">
          <p style="font-size: 1.15rem; color: var(--text-dim); line-height: 1.8; margin-bottom: 24px;">
            I graduated from <span style="color: #fff;">TAMK in May 2026</span> with a Bachelor's in Software Engineering. Over the past year I've built five projects spanning agentic AI security tooling, ETL pipelines that surface algorithmic bias in job markets, AI-driven cloud infrastructure compilers, a course benchmarking platform that won <span style="color: #fff;">€5,000 in institutional funding</span>, and zero-dependency Windows systems tooling.
          </p>
          <p style="font-size: 1.15rem; color: var(--text-dim); line-height: 1.8;">
            I'm actively pursuing <span style="color: var(--accent);">AZ-104 (Azure Administrator Associate)</span> and targeting backend, cloud, and data engineering roles in Finland. I work well at the edges of a stack — the parts where data moves, infrastructure gets provisioned, and models run, whether that's a self-hosted model on-device or a cloud API.
          </p>
        </div>

        <div class="glass-card col-span-5 reveal" style="padding: 0; background: #050508;">
          <div class="terminal" style="border: none; border-radius: 24px; box-shadow: none; height: 100%;">
            <div class="terminal-header">
              <div class="terminal-dot" style="background: #FF5F56;"></div>
              <div class="terminal-dot" style="background: #FFBD2E;"></div>
              <div class="terminal-dot" style="background: #27C93F;"></div>
              <span style="margin-left: 10px; font-size: 0.75rem; color: var(--text-faint);">walid@tahrim: ~</span>
            </div>

// Router & App Logic
function onHash() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  state.route = parts[0] || 'home';
  if (state.route === 'projects' && parts[1]) {
    state.route = 'project'; state.projectId = parts[1];
  }
  
  document.querySelectorAll('.nav-link').forEach(n => {
    n.removeAttribute('data-active');
    if (n.getAttribute('data-route') === (state.route === 'project' ? 'projects' : state.route)) {
      n.setAttribute('data-active', '');
    }
  });

  const app = document.getElementById('app');
  const maps = { home: renderHome, projects: renderProjects, project: renderProjectDetail, about: renderAbout, contact: renderContact };
  app.innerHTML = (maps[state.route] || renderHome)();
  window.scrollTo(0, 0);
  
  setTimeout(() => {
    document.querySelectorAll('.reveal').forEach((el, i) => {
      setTimeout(() => el.classList.add('active'), i * 100);
    });
    
    if (state.route === 'home') runTypewriter();
    if (state.route === 'about') runTerminal();
  }, 50);
}

function runTypewriter() {
  const tw = document.getElementById('typewriter');
  if(!tw) return;
  const text = "Backend • Cloud Infrastructure • Edge AI Inference";
  let i = 0; tw.innerHTML = '';
  const iv = setInterval(() => {
    tw.innerHTML = text.slice(0, ++i) + '<span style="border-right: 2px solid var(--accent); padding-right: 2px; animation: blink 1s step-end infinite;"></span>';
    if(i >= text.length) clearInterval(iv);
  }, 40);
}

function runTerminal() {
  const tb = document.getElementById('term-body');
  if(!tb) return;
  tb.innerHTML = '<div style="color: var(--accent); margin-bottom:10px;">$ fetching timeline...</div>';
  setTimeout(() => {
    tb.innerHTML += `
      <div style="margin-bottom: 5px;"><span style="color:#FF5F56;">2024-2026</span>  TAMK B.Eng Software Engineering</div>
      <div style="margin-bottom: 5px;"><span style="color:#FFBD2E;">2025</span>       Oppipolku Backend Lead (Funded €5k)</div>
      <div style="margin-bottom: 5px;"><span style="color:#FFBD2E;">2025</span>       Kratos Agentic Assistant</div>
      <div style="margin-bottom: 5px;"><span style="color:#FFBD2E;">2025</span>       InGen Full-Stack & GenAI</div>
      <div style="margin-bottom: 5px;"><span style="color:#27C93F;">2026</span>       Career AI ETL Pipeline</div>
      <div style="margin-top: 15px; color: var(--accent);">$ status check</div>

    `;

// Mouse Follower
document.addEventListener('mousemove', e => {
  const cursor = document.getElementById('cursor-glow');
  if(cursor) {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  }
  
  // Card hover glow effect
  document.querySelectorAll('.glass-card').forEach(card => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    card.style.setProperty('--mouse-x', `${x}px`);
    card.style.setProperty('--mouse-y', `${y}px`);
  });
});

window.addEventListener('hashchange', onHash);
document.addEventListener('DOMContentLoaded', onHash);
